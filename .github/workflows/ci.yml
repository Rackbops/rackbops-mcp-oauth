name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Public repo: CI runs on GitHub-hosted runners (private repos use the self-hosted pool).
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm biome check .
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --audit-level=high
